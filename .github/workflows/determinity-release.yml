name: Determinity release

# Cuts a Determinity release from `hq`: tag v<upstream>-determinity.<n>, four
# runtime images plus the hardened agent image, a GitHub Release marked latest,
# and release.json (the machine-readable contract, see homeserver/RELEASES.md).
#
# Gate: pushes to `hq` start none of the inherited CI workflows (they run on
# main/dev, and a push by the sync's GITHUB_TOKEN starts nothing at all), so
# the `ci` job dispatches the test workflows on `hq` itself and waits for them
# to pass on exactly the revision being released, and the `unit` job runs the
# backend unit suite against its committed failure baseline. A red or missing
# run stops the release before any image is pushed.
#
# Run it from the Actions tab on `hq` (or `gh workflow run determinity-release.yml
# --ref hq`). The upstream sync starts it after it merges a new upstream release.
#
# The tag is created by this workflow's GITHUB_TOKEN, and GitHub starts no other
# workflow for a ref that token creates. So inherited tag-triggered workflows
# (publish-images.yml on `v*`) do not run for a Determinity tag. Never push a
# Determinity tag by hand: that would start them.
#
# Order is what keeps a half-finished release invisible: images first (by
# version tag), then the tag + Release + release.json, then `latest` on the
# images. A failure before the Release leaves no tag and no Release; re-running
# picks the same version again.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and push the images as sha-<7> only: no version tags, no tag, no Release'
        required: false
        type: boolean
        default: false

# Nothing by default; each job asks for what it needs (the gate job runs
# `npm ci`, so it must not hold a token that can write anything).
permissions: {}

concurrency:
  group: determinity-release
  cancel-in-progress: false

jobs:
  plan:
    name: plan (version)
    if: github.ref == 'refs/heads/hq'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      upstream_tag: ${{ steps.v.outputs.upstream_tag }}
      upstream_commit: ${{ steps.v.outputs.upstream_commit }}
      revision: ${{ steps.v.outputs.revision }}
      short_sha: ${{ steps.v.outputs.short_sha }}
      prev_tag: ${{ steps.v.outputs.prev_tag }}
      # The tag the images are pushed under: the version, or sha-<7> on a dry run
      # (a dry run must not publish, and later move, a real version tag).
      image_tag: ${{ steps.v.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Fetch upstream release tags
        run: |
          git fetch --no-tags https://github.com/abilityai/trinity.git \
            '+refs/tags/v*:refs/upstream-tags/v*'
      - name: Next version
        id: v
        env:
          DRY: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Release names too (drafts included), so a number is not reused when
          # a tag was deleted but its Release was not.
          DETERMINITY_KNOWN_TAGS=$(gh release list --repo "$REPO" --limit 1000 --json tagName --jq '.[].tagName')
          export DETERMINITY_KNOWN_TAGS
          out=$(homeserver/release/determinity-version)
          printf '%s\n' "$out" | tee -a "$GITHUB_OUTPUT"
          if [ "$DRY" = true ]; then echo "image_tag=sha-$(sed -n 's/^short_sha=//p' <<<"$out")"
          else echo "image_tag=$(sed -n 's/^version=//p' <<<"$out")"; fi | tee -a "$GITHUB_OUTPUT"

  ci:
    name: ci (test workflows on this revision)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write   # dispatch and read the test workflows
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      REVISION: ${{ needs.plan.outputs.revision }}
      # Inherited test workflows whose jobs all run on workflow_dispatch. A
      # workflow that is disabled or missing fails the dispatch, and so the
      # release. backend-unit-test.yml is NOT here: on a dispatch it skips its
      # absolute-suite job (push only) and runs PR-diff jobs that have no base,
      # so the `unit` job below runs that absolute check instead.
      WORKFLOWS: >-
        pg-migrations.yml
        schema-parity.yml
        build-without-submodule.yml
        backend-image-smoke.yml
    steps:
      - name: Dispatch the test workflows on hq
        run: |
          set -euo pipefail
          head=$(gh api "repos/${REPO}/git/ref/heads/hq" --jq .object.sha)
          [ "$head" = "$REVISION" ] || { echo "::error::hq moved to $head after planning $REVISION; re-run"; exit 1; }
          date -u -d '-1 min' +%Y-%m-%dT%H:%M:%SZ > since
          for wf in $WORKFLOWS; do gh workflow run "$wf" --repo "$REPO" --ref hq; done
      - name: Wait for them to pass on this revision
        run: |
          set -euo pipefail
          since=$(cat since)
          for wf in $WORKFLOWS; do
            id=
            for _ in $(seq 1 30); do
              id=$(gh run list --repo "$REPO" --workflow "$wf" --branch hq --event workflow_dispatch \
                     --limit 20 --json databaseId,headSha,createdAt \
                     --jq "[.[] | select(.headSha == \"$REVISION\" and .createdAt >= \"$since\")] | sort_by(.createdAt) | last | .databaseId // empty")
              [ -n "$id" ] && break
              sleep 10
            done
            [ -n "$id" ] || { echo "::error::no $wf run started on $REVISION"; exit 1; }
            echo "$wf: run $id"
            gh run watch "$id" --repo "$REPO" --exit-status --interval 30 >/dev/null \
              || { echo "::error::$wf run $id did not pass on $REVISION"; exit 1; }
            echo "$wf: passed"
          done

  unit:
    name: unit (backend suite against the committed failure baseline)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.revision }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # Same steps as the `absolute` job in backend-unit-test.yml (push only):
      # the whole unit suite, and no failure beyond the committed baseline.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt 'pytest-randomly>=3.15.0' 'pytest-xdist>=3.5.0'
      - name: Checker self-test
        run: python scripts/ci/check-failure-baseline.py --self-test
      - name: Run unit suite
        run: |
          cd tests
          python -m pytest unit/ -m "not slow" \
            --timeout=300 --timeout-method=signal \
            -n logical --dist loadfile \
            -p randomly --randomly-seed=12345 \
            --junit-xml="$GITHUB_WORKSPACE/junit-release.xml" \
            --tb=no -q || true
      - name: Compare against the committed baseline
        run: |
          python scripts/ci/check-failure-baseline.py \
            --xml junit-release.xml \
            --baseline tests/unit_failure_baseline.txt \
            --out "$GITHUB_STEP_SUMMARY"

  gate:
    name: gate (frontend build, backend syntax)
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.revision }}
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend build
        working-directory: src/frontend
        run: |
          npm ci
          npm run build
      - name: Backend and scheduler compile
        run: python3 -m compileall -q src/backend src/scheduler
      # The release follower ships in this release; its tests gate it.
      - name: homeserver tests
        run: bash homeserver/ci/run-homeserver-tests.sh

  images:
    name: ${{ matrix.image }}
    needs: [plan, ci, unit, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: backend
            context: .
            dockerfile: docker/backend/Dockerfile
            build_args: provenance
          - image: frontend
            context: ./src/frontend
            dockerfile: docker/frontend/Dockerfile.prod
            build_args: none
          - image: scheduler
            context: .
            dockerfile: docker/scheduler/Dockerfile
            build_args: none
          - image: mcp-server
            context: ./src/mcp-server
            dockerfile: src/mcp-server/Dockerfile
            build_args: none
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.revision }}
          submodules: false
          persist-credentials: false

      - name: Build provenance
        id: prov
        run: |
          {
            echo "git_commit_subject=$(git log -1 --pretty=%s | tr -d '\n\r')"
            echo "git_commit_timestamp=$(git log -1 --pretty=%cI)"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build args
        id: args
        env:
          KIND: ${{ matrix.build_args }}
          P_VERSION: ${{ needs.plan.outputs.version }}
          P_TAG: ${{ needs.plan.outputs.tag }}
          P_GIT_COMMIT: ${{ needs.plan.outputs.revision }}
          P_GIT_COMMIT_SUBJECT: ${{ steps.prov.outputs.git_commit_subject }}
          P_GIT_COMMIT_TIMESTAMP: ${{ steps.prov.outputs.git_commit_timestamp }}
          P_BUILD_DATE: ${{ steps.prov.outputs.build_date }}
        run: |
          set -euo pipefail
          delim="DETERMINITY_EOF_$(openssl rand -hex 8)"
          {
            echo "build_args<<${delim}"
            if [ "$KIND" = provenance ]; then
              # 1.0.5-determinity.1 -> 1.0.5+determinity.1: the backend reads
              # the part before `+` as its release version (utils/app_version.py),
              # so the agent base image check compares 1.0.5 with the image's
              # label and /api/version still shows the Determinity release.
              echo "VERSION=${P_VERSION/-determinity./+determinity.}"
              echo "GIT_COMMIT=${P_GIT_COMMIT}"
              echo "GIT_COMMIT_SUBJECT=${P_GIT_COMMIT_SUBJECT}"
              echo "GIT_COMMIT_TIMESTAMP=${P_GIT_COMMIT_TIMESTAMP}"
              echo "GIT_BRANCH=${P_TAG}"
              echo "BUILD_DATE=${P_BUILD_DATE}"
            fi
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

      - name: Image name (lowercase owner)
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
        run: echo "ref=ghcr.io/${OWNER,,}/determinity-${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: tags
        env:
          REF: ${{ steps.name.outputs.ref }}
          DRY: ${{ inputs.dry_run }}
          P_VERSION: ${{ needs.plan.outputs.version }}
          P_TAG: ${{ needs.plan.outputs.tag }}
          P_SHORT: ${{ needs.plan.outputs.short_sha }}
        run: |
          set -euo pipefail
          delim="TAGS_$(openssl rand -hex 8)"
          {
            echo "tags<<${delim}"
            echo "${REF}:sha-${P_SHORT}"
            if [ "$DRY" != true ]; then echo "${REF}:${P_VERSION}"; echo "${REF}:${P_TAG}"; fi
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push (version tags only; latest moves after the Release)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=determinity-${{ matrix.image }}
            org.opencontainers.image.description=Determinity ${{ needs.plan.outputs.tag }}, a fork of Trinity by Ability AI, based on Trinity ${{ needs.plan.outputs.upstream_tag }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.revision }}
            org.opencontainers.image.created=${{ steps.prov.outputs.build_date }}
            org.opencontainers.image.licenses=Apache-2.0
            io.github.jordanallenlewis.determinity.upstream.source=https://github.com/abilityai/trinity
            io.github.jordanallenlewis.determinity.upstream.version=${{ needs.plan.outputs.upstream_tag }}
            io.github.jordanallenlewis.determinity.upstream.revision=${{ needs.plan.outputs.upstream_commit }}
          # No build cache: the Actions cache is writable by any workflow run on
          # this repository, so a cached layer could reach a published image.
          no-cache: true
          build-args: ${{ steps.args.outputs.build_args }}

      # The release pins the digest this job built, never a tag read later: a
      # re-run of the release job must not pick up an image from another run.
      - name: Record the digest
        env:
          IMAGE: ${{ matrix.image }}
          REF: ${{ steps.name.outputs.ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::build gave no digest ('$DIGEST')"; exit 1; }
          mkdir -p digest
          echo "$IMAGE $REF $DIGEST" > "digest/${IMAGE}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}
          path: digest/${{ matrix.image }}
          if-no-files-found: error
          retention-days: 30

  # The agent base image, hardened (homeserver/agent-image). Built with the
  # local docker engine, not buildx, because harden.sh builds on top of the
  # upstream image by its local tag and self-tests the result before keeping
  # it. A server tags the pulled image as trinity-agent-base:latest, the name
  # the backend creates agents from; an agent picks it up when it is recreated.
  agent-image:
    name: agent (hardened base image)
    needs: [plan, ci, unit, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.revision }}
          submodules: false
          persist-credentials: false

      - name: Overlay tests
        run: python3 -I homeserver/agent-image/test_agent_image.py

      - name: Build upstream base, then harden and self-test it
        env:
          P_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          # Same build args as upstream's publish-images.yml for this image.
          docker build -q -t trinity-agent-base:latest \
            --build-arg "VERSION=$(tr -d '[:space:]' < VERSION)" \
            -f docker/base-image/Dockerfile ./docker/base-image
          bash homeserver/agent-image/harden.sh trinity-agent-base:latest
          [ -n "$(docker image inspect -f '{{index .Config.Labels "homeserver.hardened"}}' trinity-agent-base:latest)" ] \
            || { echo "::error::agent image is not hardened"; exit 1; }

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push (version tags only; latest moves after the Release)
        env:
          OWNER: ${{ github.repository_owner }}
          DRY: ${{ inputs.dry_run }}
          P_VERSION: ${{ needs.plan.outputs.version }}
          P_TAG: ${{ needs.plan.outputs.tag }}
          P_SHORT: ${{ needs.plan.outputs.short_sha }}
        run: |
          set -euo pipefail
          ref="ghcr.io/${OWNER,,}/determinity-agent"
          tags="sha-${P_SHORT}"
          [ "$DRY" = true ] || tags="$tags ${P_VERSION} ${P_TAG}"
          for t in $tags; do
            docker tag trinity-agent-base:latest "${ref}:${t}"
            docker push -q "${ref}:${t}"
          done
          # The digest this job pushed (every tag above is the same image).
          digest=$(docker image inspect -f '{{range .RepoDigests}}{{println .}}{{end}}' "${ref}:sha-${P_SHORT}" \
                     | sed -n "s|^${ref}@||p" | head -1)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no pushed digest for ${ref}"; exit 1; }
          mkdir -p digest
          echo "agent $ref $digest" > digest/agent

      - uses: actions/upload-artifact@v7
        with:
          name: digest-agent
          path: digest/agent
          if-no-files-found: error
          retention-days: 30

  release:
    name: release (tag, Release, release.json, latest)
    needs: [plan, images, agent-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # tag and Release
      packages: write   # move `latest` on the images
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      UPSTREAM_TAG: ${{ needs.plan.outputs.upstream_tag }}
      UPSTREAM_COMMIT: ${{ needs.plan.outputs.upstream_commit }}
      REVISION: ${{ needs.plan.outputs.revision }}
      PREV_TAG: ${{ needs.plan.outputs.prev_tag }}
      DRY: ${{ inputs.dry_run }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.revision }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The digests the build jobs of this run pushed. Never read by tag here:
      # on a re-run a tag can name an image from another run.
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: digest
          merge-multiple: true

      - name: Image digests and anonymous pull check
        run: |
          set -euo pipefail
          owner="${OWNER,,}"
          accept='application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.docker.distribution.manifest.list.v2+json'
          : > digests.txt
          for img in backend frontend scheduler mcp-server agent; do
            [ -f "digest/${img}" ] || { echo "::error::no digest recorded for ${img} by this run"; exit 1; }
            read -r k name digest < "digest/${img}"
            [ "$k" = "$img" ] && [ "$name" = "ghcr.io/${owner}/determinity-${img}" ] \
              && [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] \
              || { echo "::error::bad digest record for ${img}: $(cat "digest/${img}")"; exit 1; }
            # Pull the way the server will: anonymously, by digest. A server
            # pulls without credentials, so a release whose images a stranger
            # cannot pull is refused here (a new GHCR package may start private).
            tok=$(curl -fsS "https://ghcr.io/token?scope=repository:${owner}/determinity-${img}:pull" | jq -r '.token // empty')
            code=$(curl -sS -o /dev/null -w '%{http_code}' -I -H "Authorization: Bearer ${tok}" -H "Accept: ${accept}" \
              "https://ghcr.io/v2/${owner}/determinity-${img}/manifests/${digest}")
            if [ "$code" != 200 ]; then
              echo "::error::${name}@${digest} is not publicly pullable (HTTP $code). Set the package to public, then re-run the failed jobs."
              exit 1
            fi
            # The version tag must still name the image this run built.
            tagged=$(curl -sS -I -H "Authorization: Bearer ${tok}" -H "Accept: ${accept}" \
              "https://ghcr.io/v2/${owner}/determinity-${img}/manifests/${IMAGE_TAG}" \
              | tr -d '\r' | awk 'tolower($1) == "docker-content-digest:" {print $2}')
            [ "$tagged" = "$digest" ] \
              || { echo "::error::${name}:${IMAGE_TAG} is ${tagged:-missing}, this run built ${digest}"; exit 1; }
            echo "$img $name $digest" | tee -a digests.txt
          done

      - name: Fetch upstream release tags (for the notes range)
        run: |
          git fetch --no-tags https://github.com/abilityai/trinity.git \
            '+refs/tags/v*:refs/upstream-tags/v*'

      - name: release.json and notes
        run: |
          set -euo pipefail
          # The homeserver/ files a server installs by hand (RELEASES.md
          # "Install"). They do not follow a release on their own; hs-release
          # compares its installed copies with these and warns on a mismatch.
          : > hsfiles.txt
          for f in homeserver/release/hs-release homeserver/release/hs-release.service \
                   homeserver/release/hs-release.timer homeserver/release/hs-release-alert \
                   homeserver/release/hs-release-alert.service homeserver/compose/docker-compose.box.yml; do
            [ -f "$f" ] || { echo "::error::$f is missing at $REVISION"; exit 1; }
            echo "$f $(sha256sum "$f" | cut -d' ' -f1)" >> hsfiles.txt
          done
          jq -n --arg tag "$TAG" --arg version "$VERSION" --arg revision "$REVISION" \
                --arg utag "$UPSTREAM_TAG" --arg ucommit "$UPSTREAM_COMMIT" \
                --arg repo "$REPO" --arg created "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --rawfile d digests.txt --rawfile h hsfiles.txt '
            {
              schema: "determinity-release/1",
              tag: $tag, version: $version, channel: "stable",
              repo: $repo, revision: $revision, created: $created,
              upstream: {repo: "abilityai/trinity", tag: $utag, revision: $ucommit},
              images: ($d | split("\n") | map(select(length > 0) | split(" "))
                       | map({key: .[0], value: {name: .[1], tag: $version, digest: .[2],
                                                 ref: (.[1] + "@" + .[2])}})
                       | from_entries),
              homeserver_files: ($h | split("\n") | map(select(length > 0) | split(" "))
                                 | map({key: .[0], value: .[1]}) | from_entries)
            }' > release.json
          cat release.json
          # Range for the notes: the previous Determinity release, or for the
          # first one the upstream release it is based on.
          if git rev-parse -q --verify "refs/tags/${PREV_TAG}" >/dev/null \
             && [ "$PREV_TAG" != "$UPSTREAM_TAG" ]; then base="refs/tags/${PREV_TAG}"
          else base="refs/upstream-tags/${UPSTREAM_TAG}"; fi
          {
            echo "Determinity ${TAG}, based on [Trinity ${UPSTREAM_TAG}](https://github.com/abilityai/trinity/releases/tag/${UPSTREAM_TAG}) by Ability AI."
            echo
            echo "## Changes in Determinity since ${PREV_TAG}"
            echo
            # Fork commits only: anything upstream's release contains is left out.
            git log --no-merges --format='- %s (%h)' "${base}..${REVISION}" "^refs/upstream-tags/${UPSTREAM_TAG}"
            echo
            echo "## Images"
            echo
            echo "| Image | Tag | Digest |"
            echo "|---|---|---|"
            while read -r img name digest; do
              echo "| \`${name}\` | \`${VERSION}\` | \`${digest}\` |"
            done < digests.txt
            echo
            echo "\`determinity-agent\` is the hardened agent base image (homeserver/agent-image). A server tags it \`trinity-agent-base:latest\`; each agent runs it from its next recreate."
            echo
            echo "Install, upgrade and roll back: [homeserver/RELEASES.md](https://github.com/${REPO}/blob/${TAG}/homeserver/RELEASES.md). Machine-readable: \`release.json\`, attached below."
          } > notes.md
          cat notes.md

      - name: Create the tag and the Release
        if: env.DRY != 'true'
        run: |
          set -euo pipefail
          # Order: tag (checked) -> draft Release -> release.json (checked) ->
          # publish as latest. Nothing a server reads exists before every check
          # has passed. Re-runnable: a tag on this revision and a draft from an
          # earlier attempt are reused; a published Release is never rewritten.
          if sha=$(gh api "repos/${REPO}/git/ref/tags/${TAG}" --jq .object.sha 2>/dev/null); then
            echo "tag $TAG exists at $sha"
          else
            # Lightweight tag by this token: GitHub starts no workflow for it.
            gh api -X POST "repos/${REPO}/git/refs" -f "ref=refs/tags/${TAG}" -f "sha=${REVISION}" >/dev/null
            sha=$(gh api "repos/${REPO}/git/ref/tags/${TAG}" --jq .object.sha)
          fi
          [ "$sha" = "$REVISION" ] || { echo "::error::tag $TAG points at $sha, expected $REVISION"; exit 1; }

          if state=$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$state" != true ]; then
              # Published already: it may be what servers run. Finish only if
              # it carries exactly this release.json; never replace it.
              gh release download "$TAG" --repo "$REPO" -p release.json -O published.json
              if ! cmp -s <(jq -S 'del(.created)' published.json) <(jq -S 'del(.created)' release.json); then
                echo "::error::Release $TAG is published with a different release.json; not touching it"
                exit 1
              fi
              cp published.json release.json
            else
              echo "Release $TAG is a draft from an earlier attempt; refreshing it"
              gh release upload "$TAG" release.json --repo "$REPO" --clobber
              gh release edit "$TAG" --repo "$REPO" --notes-file notes.md
            fi
          else
            gh release create "$TAG" release.json --draft --verify-tag \
              --repo "$REPO" --title "Determinity ${TAG}" --notes-file notes.md
          fi

          # The asset as a server will read it must be byte-identical to ours.
          gh release download "$TAG" --repo "$REPO" -p release.json -O check.json --clobber
          cmp -s check.json release.json || { echo "::error::uploaded release.json differs from the one built"; exit 1; }
          author=$(gh release view "$TAG" --repo "$REPO" --json author --jq .author.login)
          [ "$author" = "github-actions" ] || [ "$author" = "github-actions[bot]" ] \
            || { echo "::error::Release $TAG author is '$author'; servers accept only github-actions[bot]"; exit 1; }

          gh release edit "$TAG" --repo "$REPO" --draft=false --latest
          # releases/latest can lag the publish by a few seconds.
          got=
          for _ in 1 2 3 4 5 6; do
            got=$(gh api "repos/${REPO}/releases/latest" --jq .tag_name 2>/dev/null || true)
            [ "$got" = "$TAG" ] && break
            sleep 10
          done
          [ "$got" = "$TAG" ] || { echo "::error::releases/latest is '$got', expected '$TAG'"; exit 1; }

      - name: Move latest on the images
        if: env.DRY != 'true'
        run: |
          set -euo pipefail
          while read -r img name digest; do
            docker buildx imagetools create -t "${name}:latest" "${name}@${digest}"
          done < digests.txt

      - name: Dry run result
        if: env.DRY == 'true'
        run: echo "dry run - images pushed as ${IMAGE_TAG} only; no version tags, no tag, no Release, latest unchanged"
