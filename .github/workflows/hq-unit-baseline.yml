name: hq unit baseline

# Runs the backend unit suite on pull requests into `hq` and fails on any
# failure outside tests/unit_failure_baseline.txt (upstream's) and
# homeserver/ci/unit-failure-baseline.txt (the fork's). The release workflow's
# `unit` job runs the same script, so a pull request this check runs on that
# would turn the release gate red is red here before it merges. GitHub does
# not start it by itself on the pull requests the upstream sync opens with the
# workflow token. The inherited backend-unit-test.yml compares the base
# against the head, which stays green when both fail the same way; this check
# is absolute. No path filter: a change to a workflow, a doc or the tree can
# fail an upstream test that reads the repository itself.

on:
  pull_request:
    branches: [hq]

permissions:
  contents: read

concurrency:
  group: hq-unit-baseline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit suite against the committed baselines
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt 'pytest-randomly>=3.15.0' 'pytest-xdist>=3.5.0'
      - name: Unit suite against the committed baselines
        run: bash homeserver/ci/run-unit-baseline.sh "$GITHUB_STEP_SUMMARY"
